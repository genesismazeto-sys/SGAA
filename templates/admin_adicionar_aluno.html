<!-- templates/admin_adicionar_aluno.html -->
{% extends "base.html" %}
{% block title %}{{ user_message("Adicionar Aluno") }}{% endblock %}

{% block content %}
<h1 class="main-title">{{ user_message("Adicionar Aluno") }}</h1>

<form action="{{ url_for('admin_adicionar_aluno') }}"
  method="post"
  enctype="multipart/form-data"
  autocomplete="off">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% if return_to %}
  <input type="hidden" name="return_to" value="{{ return_to }}">
  {% endif %}

  <div class="form-cards-narrow">

  <!-- Avatar -->
  <div class="form-row" aria-hidden="false">
    <label class="row-label">{{ user_message("Foto") }}</label>
    <div>
      <div id="avatar-wrap">
        <div id="avatar-box" aria-label="{{ user_message('Foto do aluno') }}">
          <!-- Imagem atual (inicialmente sem foto) -->
          <img id="avatar-img" alt="{{ user_message('Foto do aluno') }}" style="display:none;" />
          <!-- Placeholder quando não há foto -->
          <div id="avatar-placeholder"><i class="lucide" data-lucide="user"></i></div>

          <!-- Ações: no-foto mostra +; has-foto mostra câmera/lixeira -->
          <div id="avatar-actions" class="no-foto" aria-hidden="false">
            <button class="icon-btn primary" type="button" id="btn-avatar-adicionar" title="{{ user_message('Adicionar foto') }}"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-plus"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M12 5l0 14" /><path d="M5 12l14 0" /></svg></button>
            <button class="icon-btn" type="button" id="btn-avatar-editar" title="{{ user_message('Alterar foto') }}"><i class="lucide" data-lucide="camera"></i></button>
            <button class="icon-btn danger" type="button" id="btn-avatar-remover" title="{{ user_message('Remover foto') }}"><i class="lucide" data-lucide="trash-2"></i></button>
          </div>
        </div>

        <input type="file" id="avatar-file" name="foto" accept="image/*" hidden>
        <input type="hidden" id="avatar-remove-flag" name="remove_foto" value="0">
      </div>
    </div>
  </div>

  <!-- Nome -->
  <div class="form-row">
    <label class="row-label" for="nome">{{ user_message("Nome") }}</label>
    <div class="field-card">
      <div class="field-chip"><i class="lucide" data-lucide="user"></i></div>
      <input id="nome" name="nome" type="text" class="control" placeholder="{{ user_message('Nome completo') }}" required>
    </div>
  </div>

  <!-- E-mail -->
  <div class="form-row">
    <label class="row-label" for="email">{{ user_message("E-mail") }}</label>
    <div class="field-card">
      <div class="field-chip"><i class="lucide" data-lucide="mail"></i></div>
      <input id="email" name="email" type="email" class="control" placeholder="{{ user_message('email@exemplo.com') }}" required>
    </div>
  </div>

  <!-- Senha -->
  <div class="form-row">
    <label class="row-label" for="senha">{{ user_message("Senha") }}</label>
    <div class="field-card">
      <div class="field-chip"><i class="lucide" data-lucide="lock"></i></div>
      <div class="pw-wrapper">
        <input id="senha" name="senha" type="password" class="control" placeholder="{{ user_message('Senha inicial') }}">
        <button type="button" class="pw-toggle" aria-label="{{ user_message('Mostrar senha') }}" aria-pressed="false">
          <svg class="pw-icon-on" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"/><path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6"/></svg>
          <svg class="pw-icon-off" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10.585 10.587a2 2 0 0 0 2.829 2.828"/><path d="M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0 -6.6 -2 -9 -6c1.272 -2.12 2.712 -3.678 4.32 -4.674m2.86 -1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11 -1.379 2.067 -2.138 2.87"/><path d="M3 3l18 18"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Matrícula -->
  <div class="form-row">
    <label class="row-label" for="matricula">{{ user_message("Matrícula") }}</label>
    <div class="field-card">
      <div class="field-chip"><i class="lucide" data-lucide="id-card"></i></div>
      <input id="matricula" name="matricula" type="text" class="control" placeholder="{{ user_message('Número de matrícula') }}" required>
    </div>
  </div>

  <!-- Turma -->
  <div class="form-row">
    <label class="row-label" for="turma_id">{{ user_message("Turma") }}</label>
    <div class="field-card">
      <div class="field-chip"><i class="lucide" data-lucide="graduation-cap"></i></div>
      <select id="turma_id" name="turma_id" class="control">
        <option value="">{{ user_message("— Sem vínculo —") }}</option>
        {% for t in turmas %}
          <option value="{{ t.id }}" {{ 'selected' if turma_default_id and t.id == turma_default_id else '' }}>{{ t.nome }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <!-- Status -->
  <div class="form-row">
    <label class="row-label" for="status">{{ user_message("Status") }}</label>
    <div class="field-card">
      <div class="field-chip"><i class="lucide" data-lucide="badge-check"></i></div>
      <select id="status" name="status" class="control" required>
        <option value="Ativo" selected>{{ user_message("Ativo") }}</option>
        <option value="Inativo">{{ user_message("Inativo") }}</option>
      </select>
    </div>
  </div>

  <!-- Ações -->
  <div class="form-actions">
    <a href="{{ return_to or url_for('admin_alunos') }}" class="btn">{{ user_message("Cancelar") }}</a>
    <button type="submit" class="btn primary">
      <i class="lucide btn-icon-save" data-lucide="check"></i><span class="btn-label">{{ user_message("Salvar") }}</span>
    </button>
  </div>
  </div>
</form>

{% block extra_head %}
  <style>
    /* Reduz largura do formulário e centraliza ações */
    .form-cards-narrow{
      width: calc(var(--form-card-w) * 0.55);
      max-width: calc(100vw - 64px);
      margin: 0 auto;
      padding-top: var(--form-top-pad);
      display: grid;
      row-gap: 12px;
    }
    .form-cards-narrow .row-label{ right: calc(100% + var(--form-gap)); width: var(--form-label-w); }
    .form-actions{ justify-content:center; }
  </style>
{% endblock %}

<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (window.lucide) lucide.createIcons();

    const fileInput = document.getElementById('avatar-file');
    const imgEl = document.getElementById('avatar-img');
    const placeholder = document.getElementById('avatar-placeholder');
    const actions = document.getElementById('avatar-actions');
    const removeFlag = document.getElementById('avatar-remove-flag');

    const btnAdd = document.getElementById('btn-avatar-adicionar');
    const btnEdit = document.getElementById('btn-avatar-editar');
    const btnRemove = document.getElementById('btn-avatar-remover');

    const toHasFoto = () => {
      actions.classList.remove('no-foto');
      actions.classList.add('has-foto');
      placeholder.style.display = 'none';
      imgEl.style.display = 'block';
      removeFlag.value = '0';
    };
    const toNoFoto = () => {
      actions.classList.remove('has-foto');
      actions.classList.add('no-foto');
      imgEl.src = '';
      imgEl.style.display = 'none';
      placeholder.style.display = 'grid';
    };

    const openPicker = () => fileInput?.click();

    btnAdd?.addEventListener('click', openPicker);
    btnEdit?.addEventListener('click', openPicker);
    btnRemove?.addEventListener('click', () => {
      // Limpa seleção e marca remoção
      if (fileInput) fileInput.value = '';
      removeFlag.value = '1';
      toNoFoto();
    });

    fileInput?.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        imgEl.src = ev.target.result;
        toHasFoto();
      };
      reader.readAsDataURL(file);
    });
  });
</script>
{% endblock %}
