{% extends "base.html" %}
{% block title %}Nova norma de atividade{% endblock %}

{% block content %}
<h1 class="main-title">Nova norma de atividade</h1>

<form action="{{ url_for('admin_norma_nova') }}"
      method="post"
      autocomplete="off">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="form-cards-narrow">

    <!-- Código -->
    <div class="form-row">
      <label class="row-label" for="codigo">Código</label>
      <div class="field-card">
        <div class="field-chip"><i class="lucide" data-lucide="hash"></i></div>
        <input id="codigo"
               name="codigo"
               type="text"
               class="control"
               placeholder="Ex.: RESOLUÇÃO-001"
               value="{{ codigo }}"
               required>
      </div>
    </div>

    <!-- Eixo -->
    <div class="form-row">
      <label class="row-label" for="eixo">Eixo</label>
      <div class="field-card">
        <div class="field-chip"><i class="lucide" data-lucide="layers"></i></div>
        <select id="eixo" name="eixo" class="control">
          <option value="AAC" {% if eixo == 'AAC' %}selected{% endif %}>AAC</option>
          <option value="AEU" {% if eixo == 'AEU' %}selected{% endif %}>AEU</option>
        </select>
      </div>
    </div>

    <!-- Revisão -->
    <div class="form-row">
      <label class="row-label" for="revisao">Revisão</label>
      <div class="field-card">
        <div class="field-chip"><i class="lucide" data-lucide="git-branch"></i></div>
        <input id="revisao"
               name="revisao"
               type="text"
               class="control"
               placeholder="Ex.: rev1, 2024.1"
               value="{{ revisao }}"
               required>
      </div>
    </div>

    <!-- Nome -->
    <div class="form-row">
      <label class="row-label" for="nome">Nome</label>
      <div class="field-card">
        <div class="field-chip"><i class="lucide" data-lucide="file-text"></i></div>
        <input id="nome"
               name="nome"
               type="text"
               class="control"
               placeholder="Nome descritivo da norma (opcional)"
               value="{{ nome }}">
      </div>
    </div>

    <!-- Descrição -->
    <div class="form-row">
      <label class="row-label" for="descricao">Descrição</label>
      <div class="field-card field-card--textarea">
        <div class="field-chip"><i class="lucide" data-lucide="align-left"></i></div>
        <textarea id="descricao"
                  name="descricao"
                  class="control"
                  rows="3"
                  placeholder="Descrição opcional">{{ descricao }}</textarea>
      </div>
    </div>

    <!-- Status -->
    <div class="form-row">
      <label class="row-label" for="status">Status</label>
      <div class="field-card">
        <div class="field-chip"><i class="lucide" data-lucide="toggle-right"></i></div>
        <select id="status" name="status" class="control">
          <option value="ativa" {% if status == 'ativa' %}selected{% endif %}>Ativa</option>
          <option value="inativa" {% if status == 'inativa' %}selected{% endif %}>Inativa</option>
        </select>
      </div>
    </div>

    <!-- Ações -->
    <div class="form-row form-actions">
      <span></span>
      <div style="display:flex; gap:8px;">
        <a href="{{ url_for('admin_normas_atividade') }}" class="btn btn-ghost">Cancelar</a>
        <button type="submit" class="btn btn-primary">Criar norma</button>
      </div>
    </div>

  </div>
</form>
{% endblock %}

{% block extra_scripts %}
<script>
  document.addEventListener('DOMContentLoaded', function() {
    if (window.lucide) lucide.createIcons();
  });
</script>
{% endblock %}
