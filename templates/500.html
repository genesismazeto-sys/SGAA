<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Erro interno</title>
  <!-- Error pages intentionally use literal paths (no url_for) so they render
       with the fewest possible dependencies. Keep this order in sync with
       templates/components/design_system_css.html. -->
  <link rel="stylesheet" href="/static/css/foundation/tokens.css" />
  <link rel="stylesheet" href="/static/css/modern-style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f5f6f8; }
    .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.08); max-width: 520px; }
    h1 { margin: 0 0 .5rem; font-size: 1.8rem; }
    p { color: #5a6270; margin: 0 0 1rem; }
    a.btn { display: inline-block; background: #1e7bf6; color: #fff; padding: .6rem 1rem; border-radius: 10px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Erro interno (500)</h1>
    <p>Ocorreu um erro interno no servidor. Tente novamente em instantes.</p>
    <a class="btn" href="/">Voltar</a>
  </div>
</body>
</html>
