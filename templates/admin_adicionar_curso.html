<!-- templates/admin_adicionar_curso.html -->
{% extends "base.html" %}
{% block title %}Novo Curso{% endblock %}
{% block content %}
<h1 class="main-title">Novo Curso</h1>

<form method="POST">
  <div class="form-cards-narrow">
    <div class="form-row">
      <label class="row-label">Nome</label>
      <div class="field-card">
        <div class="field-chip"><i class="lucide" data-lucide="type"></i></div>
        <input class="control" type="text" name="nome" required>
      </div>
    </div>

    <div class="form-row">
      <label class="row-label">Código</label>
      <div class="field-card">
        <div class="field-chip"><i class="lucide" data-lucide="barcode"></i></div>
        <input class="control" type="text" name="codigo" maxlength="20" placeholder="APENAS LETRAS (A–Z)" required>
      </div>
    </div>

    <div class="form-row">
      <label class="row-label">Duração (períodos)</label>
      <div class="field-card">
        <div class="field-chip"><i class="lucide" data-lucide="clock-3"></i></div>
        <input class="control" type="number" name="duracao_periodos" min="1" required>
      </div>
    </div>

    <div class="form-row">
      <label class="row-label">Status</label>
      <div class="field-card">
        <div class="field-chip"><i class="lucide" data-lucide="toggle-left"></i></div>
        <select class="control" name="status">
          <option value="ativo">Ativo</option>
          <option value="inativo">Inativo</option>
        </select>
      </div>
    </div>

    <div class="form-actions">
      <a class="btn" href="{{ url_for('admin_cursos') }}">Cancelar</a>
      <button class="btn primary" type="submit"><i class="lucide btn-icon-save" data-lucide="check"></i><span class="btn-label">Salvar</span></button>
    </div>
  </div>
</form>
{% block extra_head %}
  <style>
    .form-cards-narrow{
      width: calc(var(--form-card-w) * 0.55);
      max-width: calc(100vw - 64px);
      margin: 0 auto;
      padding-top: var(--form-top-pad);
      display: grid;
      row-gap: 12px;
    }
    .form-cards-narrow .row-label{ right: calc(100% + var(--form-gap)); width: var(--form-label-w); }
    .form-actions{ justify-content:center; }
  </style>
{% endblock %}
{% endblock %}
