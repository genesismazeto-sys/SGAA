{% from 'components/design_system_css.html' import design_system_css %}
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar senha</title>
    {{ design_system_css() }}
  </head>
  <body>
    <main class="login-page">
      <div class="login-card">
        <img src="{{ url_for('static', filename='images/ej_logo_dark.jpg') }}" alt="Logo" width="100" />
        <h1 class="login-title">Recuperar senha</h1>
        <p class="login-subtitle">Informe o e-mail usado no SGAA.</p>

        {% if submitted %}
          <p class="login-feedback login-feedback-success" aria-live="polite">{{ neutral_message }}</p>
        {% else %}
          <form method="POST" action="{{ url_for('forgot_password') }}" class="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="recovery-email">E-mail</label>
            <input type="email" id="recovery-email" name="email" value="{{ email_value or '' }}" autocomplete="email" required autofocus />
            <button type="submit">Enviar instruções</button>
          </form>
        {% endif %}

        <p class="login-footer"><a class="login-forgot-link" href="{{ url_for('login') }}">Voltar para o login</a></p>
      </div>
    </main>
  </body>
</html>
