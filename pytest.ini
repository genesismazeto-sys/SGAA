[pytest]
testpaths = tests
norecursedirs = tools Backup _archive backups venv .venv node_modules uploads logs static templates
markers =
    d73h_historical: D73H historical verification tests requiring explicit sanitized artifact paths (--d73h-source-db, --d73h-source-backup)
    visual: Design-system visual regression tests (opt-in via --visual; needs Playwright)
